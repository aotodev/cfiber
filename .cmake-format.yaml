---
# cmake-format configuration for cfiber.
# Matches the project's clang-format settings (4-space indent, 120 columns).

format:
  line_width: 120
  tab_size: 4
  use_tabchars: false
  separate_ctrl_name_with_space: false
  separate_fn_name_with_space: false
  dangle_parens: false
  max_subgroups_hwrap: 4
  max_pargs_hwrap: 6
  enable_sort: false
  autosort: false
  command_case: lower
  keyword_case: unchanged

lint:
  disabled_codes:
    - C0103 # function name style, flags add_arm_executable as non-canonical
    - C0111 # missing docstring
    - C0301 # line too long, already enforced by line_width
