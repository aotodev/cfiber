# Time-boxed libFuzzer smoke run for the allocator, scheduler and reactor harnesses.
# The corpus is cached across runs so coverage accumulates.
name: fuzz

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'include/**'
      - 'fuzz/**'
      - 'cmake/**'
      - '**/CMakeLists.txt'
      - '.github/workflows/fuzz.yml'
  pull_request:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/aotodev/cfiber-ci@sha256:bfce13eaad965b4a0b445f55c5fa1093aa7efb3c6edb1302fd052678e528eb16
    steps:
      - uses: actions/checkout@v4
      # Unique key so every run saves; restore-keys picks up the newest.
      - name: Restore fuzz corpus
        uses: actions/cache@v4
        with:
          path: fuzz-corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Build fuzzers
        run: |
          CC=clang cmake -G Ninja -B build-fuzz \
            -DBUILD_TESTS=ON -DCFIBER_FUZZ=ON -DCFIBER_REACTOR=ON \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build-fuzz -j
      - name: Smoke-run fuzzers
        run: |
          mkdir -p fuzz-corpus/multislab fuzz-corpus/scheduler fuzz-corpus/reactor
          flags="-max_total_time=45 -rss_limit_mb=4096 -print_final_stats=1"
          ./build-fuzz/fuzz/fuzz_multislab $flags fuzz-corpus/multislab
          ./build-fuzz/fuzz/fuzz_scheduler $flags fuzz-corpus/scheduler
          ./build-fuzz/fuzz/fuzz_reactor $flags fuzz-corpus/reactor
