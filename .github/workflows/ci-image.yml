# Builds and pushes the cfiber CI toolchain image to ghcr.io; the test workflows only
# pull it, pinned by digest. On demand only, so toolchain bumps stay deliberate.
name: ci-image

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'ci/Containerfile'
      - '.github/workflows/ci-image.yml'

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      # The date tag is the rollback handle; latest is convenience only.
      - name: Build and push
        run: |
          docker build -f ci/Containerfile \
            -t ghcr.io/aotodev/cfiber-ci:latest \
            -t "ghcr.io/aotodev/cfiber-ci:$(date -u +%Y%m%d)" ci/
          docker push --all-tags ghcr.io/aotodev/cfiber-ci
      # Paste into the test workflows' container.image to roll forward.
      - name: Print digest
        run: docker inspect --format '{{index .RepoDigests 0}}' ghcr.io/aotodev/cfiber-ci:latest
