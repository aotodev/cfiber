# Bare-metal ARM Cortex-M3 build + tests, run under qemu-system-arm.
name: cortex-m3

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'examples/**'
      - 'utils/**'
      - 'cmake/**'
      - '**/CMakeLists.txt'
      - '.github/workflows/cortex-m3.yml'
  pull_request:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/aotodev/cfiber-ci@sha256:cd13edcbbd67802d1ca1bd120e9dfde573f04a6b0a1155dc4d438ab956104ab0
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release
            args: "-t -e --arch=arm --cpu=cortex-m3"
          - name: stack-sanitizer
            args: "-t -e -d --arch=arm --cpu=cortex-m3 --sanitizer"
    name: "cortex-m3 (${{ matrix.name }})"
    steps:
      - uses: actions/checkout@v4
      - name: Build and run tests
        run: ./utils/make.sh ${{ matrix.args }}
