# Native x86_64 build + tests: Release and Debug, gcc and clang, under the sanitizers,
# plus the plain cmake/ctest path from the README.
name: x86_64

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'examples/**'
      - 'fuzz/**'
      - 'utils/**'
      - 'cmake/**'
      - '**/CMakeLists.txt'
      - '.github/workflows/x86_64.yml'
  pull_request:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/aotodev/cfiber-ci@sha256:cd13edcbbd67802d1ca1bd120e9dfde573f04a6b0a1155dc4d438ab956104ab0
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release
            cc: gcc
            args: "-t -e --reactor"
          - name: release-clang
            cc: clang
            args: "-t -e --reactor"
          - name: debug-asan
            cc: gcc
            args: "-t -e -d --asan --reactor"
          - name: debug-asan-clang
            cc: clang
            args: "-t -e -d --asan --reactor"
          - name: debug-ubsan
            cc: gcc
            args: "-t -e -d --ubsan --reactor --pic"
          - name: debug-asan-ubsan
            cc: clang
            args: "-t -d --asan --ubsan"
          - name: stack-sanitizer
            cc: gcc
            args: "-t -e -d --sanitizer"
          - name: shared
            cc: gcc
            args: "-t -e --shared --reactor"
    name: "x86_64 (${{ matrix.name }})"
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and run tests
        run: ./utils/make.sh ${{ matrix.args }}

  ctest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/aotodev/cfiber-ci@sha256:cd13edcbbd67802d1ca1bd120e9dfde573f04a6b0a1155dc4d438ab956104ab0
    name: "x86_64 (ctest)"
    steps:
      - uses: actions/checkout@v4
      - name: Configure, build and run ctest
        run: |
          cmake -B build -DCFIBER_BUILD_EXAMPLES=ON -DCFIBER_BUILD_TESTS=ON -DCFIBER_REACTOR=ON
          cmake --build build -j
          ctest --test-dir build --output-on-failure
      # Out-of-tree consumers against staged installs: find_package, then the plain
      # compiler + pkg-config route, then the shared library at run time.
      - name: Install and build consumers
        run: |
          cmake --install build --prefix "$PWD/stage"
          cmake -S tests/consumer -B build-consumer -DCMAKE_PREFIX_PATH="$PWD/stage"
          cmake --build build-consumer
          ./build-consumer/consumer
          export PKG_CONFIG_PATH="$PWD/stage/lib/pkgconfig"
          cc -std=c23 $(pkg-config --cflags cfiber) tests/consumer/consumer.c $(pkg-config --libs cfiber) -o consumer-pc
          ./consumer-pc
          cmake -B build-shared -DCFIBER_BUILD_SHARED=ON -DCFIBER_REACTOR=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-shared -j
          cmake --install build-shared --prefix "$PWD/stage-shared"
          cmake -S tests/consumer -B build-consumer-shared -DCMAKE_PREFIX_PATH="$PWD/stage-shared"
          cmake --build build-consumer-shared
          LD_LIBRARY_PATH="$PWD/stage-shared/lib" ./build-consumer-shared/consumer
          ldd build-consumer-shared/consumer | grep -q 'libcfiber\.so\.0'
