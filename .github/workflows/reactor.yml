# Optional epoll(7) reactor (Linux, x86_64) under ThreadSanitizer.
name: reactor

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/reactor/**'
      - 'examples/ws_echo/**'
      - 'utils/**'
      - 'cmake/**'
      - '**/CMakeLists.txt'
      - '.github/workflows/reactor.yml'
  pull_request:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  tsan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/aotodev/cfiber-ci@sha256:cd13edcbbd67802d1ca1bd120e9dfde573f04a6b0a1155dc4d438ab956104ab0
    name: "reactor (tsan)"
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
      - name: Build and run reactor tests under ThreadSanitizer
        run: ./utils/make.sh -t -e -d --tsan --reactor
