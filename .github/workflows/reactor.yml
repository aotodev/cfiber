# Optional epoll(7) reactor (Linux, x86_64) under ThreadSanitizer.
name: reactor

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/reactor/**'
      - 'examples/ws_echo/**'
      - 'utils/**'
      - 'cmake/**'
      - '**/CMakeLists.txt'
      - '.github/workflows/reactor.yml'
  pull_request:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  tsan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/aotodev/cfiber-ci@sha256:bfce13eaad965b4a0b445f55c5fa1093aa7efb3c6edb1302fd052678e528eb16
    name: "reactor (tsan)"
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
      - name: Build and run reactor tests under ThreadSanitizer
        run: ./utils/make.sh -t -e -d --tsan --reactor
