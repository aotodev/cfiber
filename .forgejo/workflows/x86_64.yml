# Native x86_64 build + tests under the sanitizers.
name: x86_64

on:
  push:
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'examples/**'
      - 'fuzz/**'
      - 'utils/**'
      - 'cmake/**'
      - '**/CMakeLists.txt'
      - '.forgejo/workflows/**'
  pull_request:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: docker
    container:
      image: "${{ vars.CI_IMAGE }}"
      credentials:
        username: "${{ github.repository_owner }}"
        password: "${{ secrets.REGISTRY_TOKEN }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan
            args: "-t -e -d --asan --reactor"
          - name: ubsan
            args: "-t -e -d --ubsan --reactor"
          - name: stack-sanitizer
            args: "-t -e -d --sanitizer"
          # Shared build (Release). No -t: the whitebox unit tests reference
          # internal, non-exported symbols and cannot link the shared library.
          # The examples are the consumer smoke test; they link the public API
          # only, so a missing export fails the build.
          - name: shared
            args: "-e --shared --reactor"
    name: "x86_64 (${{ matrix.name }})"
    steps:
      - uses: actions/checkout@v4
      - name: Build and run tests
        run: ./utils/make.sh ${{ matrix.args }}
